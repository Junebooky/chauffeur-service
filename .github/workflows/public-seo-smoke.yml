name: Public SEO smoke
on:
  pull_request:
    paths:
      - '.github/workflows/public-seo-smoke.yml'
      - 'scripts/verify-seo-release.mjs'
      - 'scripts/public-analytics-browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify public HTML, sitemaps, RSS and robots
        run: node scripts/verify-seo-release.mjs --live
      - name: Install browser
        if: always()
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Inspect live client analytics queue without sending events
        if: always()
        run: python3 scripts/public-analytics-browser.py

name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: API and UI contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Customer locale responsive checks
        run: python3 scripts/customer-locale-browser.py
      - name: Upload locale screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-locale-screenshots
          path: test-results/customer-locale/
          if-no-files-found: ignore
